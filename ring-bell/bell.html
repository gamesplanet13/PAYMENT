<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bell | Games Planet</title><link rel="stylesheet" href="style.css"></head><body data-role="bell"><main><nav aria-label="Ring और Bell"><a href="./">Ring और Bell</a><a href="ring.html">Ring खोलें</a></nav><img class="app-icon" src="icon_bell.png" alt=""><h1>🔔 Bell</h1><p>इस डिवाइस का कोड</p><div class="code" id="myCode">•••••</div><label for="code">Ring का 5 अंकों का कोड</label><input id="code" inputmode="numeric" maxlength="5" placeholder="00000"><button id="dial" class="primary">📞 Ring डिवाइस को कॉल करें</button><p class="hint">कॉल आने पर आप पहले आगंतुक को देख और सुन सकते हैं। आपकी आवाज़ कॉल उठाने पर जाएगी।</p><button id="accept" class="primary" hidden>📞 कॉल उठाएँ</button><button id="hangup" class="danger" hidden>कॉल बंद करें</button><div class="videos" hidden id="videos"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay playsinline muted></video></div><audio id="audio" autoplay playsinline></audio><div id="controls" hidden><button id="mic" class="secondary">🎙️ माइक बंद करें</button><button id="camera" class="secondary">📷 कैमरा चालू करें</button><button id="speaker" class="secondary">🔊 स्पीकर बंद करें</button><label>आवाज़ <input id="volume" type="range" min="0" max="100" value="80"></label></div><button type="button" id="enableSound" class="secondary" hidden>घंटी की आवाज़ चालू करें</button><p id="status" role="status">कनेक्ट हो रहा है…</p><p class="hint">कॉल के लिए इंटरनेट, कैमरा और माइक की अनुमति दें। कॉल पाने के लिए यह पेज खुला रखें।</p></main><script src="peerjs-1.5.5.min.js"></script><script src="gurbani-peer-manager.js"></script><script src="bell.js"></script></body></html>
