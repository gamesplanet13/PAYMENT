name: Build update-enabled apps
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'
      - 'tv-app/**'
      - '.github/workflows/update-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build control
        run: gradle -p mobile-app --no-daemon assembleDebug
      - name: Build projection
        run: gradle -p tv-app --no-daemon assembleDebug
      - name: Collect signing tool
        run: |
          mkdir output
          cp mobile-app/app/build/outputs/apk/debug/app-debug.apk output/control-unsigned-signature.apk
          cp tv-app/app/build/outputs/apk/debug/app-debug.apk output/projection-unsigned-signature.apk
          cp "$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)" output/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: update-enabled-build
          path: output/
          if-no-files-found: error
