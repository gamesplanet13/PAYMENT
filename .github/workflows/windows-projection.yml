name: Build Windows Projection
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-projection/**'
      - '.github/workflows/windows-projection.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64, x86]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
      - name: Install build tools
        run: python -m pip install "pywebview>=5.4,<7" "pystray>=0.19,<1" "pillow>=10,<13" "pyinstaller>=6,<7"
      - name: Test visibility behavior
        run: python -m unittest discover -s windows-projection -v
      - name: Build standalone Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name GamesPlanetProjection --collect-all webview --collect-all pythonnet --collect-all clr_loader windows-projection/main.py
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/GamesPlanetProjection.exe" -ArgumentList "--self-test" -PassThru
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw "Executable self-test timed out" }
          if ($p.ExitCode -ne 0) { throw "Executable self-test failed: $($p.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/GamesPlanetProjection.exe package/GamesPlanetProjection.exe
          Compress-Archive -Path package/GamesPlanetProjection.exe -DestinationPath GamesPlanetProjection-Windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GamesPlanet-Windows-Projection-${{ matrix.arch }}
          path: |
            package/GamesPlanetProjection.exe
            GamesPlanetProjection-Windows-${{ matrix.arch }}.zip
          if-no-files-found: error
